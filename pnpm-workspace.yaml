allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security floors for transitive build/runtime dependencies. Keep these until
# every upstream range resolves to an equal or newer patched release.
overrides:
  "esbuild@<=0.24.2": 0.25.12
  "nanoid@<3.3.18": 3.3.18
  "postcss@<=8.5.22": 8.5.28
  "sharp@<0.35.4": 0.35.4
  "vite@<=6.4.2": 6.4.3
